services:
  - type: web
    name: setu-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit

  - type: web
    name: setu-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: station_navigation
      - key: DB_SSL
        value: "true"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CHATBOT_URL
        sync: false
      - key: CHATBOT_TIMEOUT_MS
        value: "90000"
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: setu-chatbot
    runtime: docker
    plan: free
    region: singapore
    rootDir: CHAT_BOT
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: BUILD_DB_ENABLED
        value: "false"
      - key: ENABLE_DOCS
        value: "false"
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: setu-crowd
    runtime: docker
    plan: free
    region: singapore
    rootDir: Crowd-Model-System
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: CORS_ORIGIN
        sync: false
